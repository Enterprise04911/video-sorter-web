name: Release

on:
  push:
    tags:
      - "v*"          # 打 v1.0.0 之类的 tag 会触发
  workflow_dispatch:  # 也支持手动触发

permissions:
  contents: write     # 需要它才能把 exe 上传到 Release

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: python build/build_exe.py

      - name: Upload artifact (Actions 页可下载)
        uses: actions/upload-artifact@v4
        with:
          name: VideoSorter-Windows
          path: dist/VideoSorter.exe
          if-no-files-found: error

      - name: Attach to Release (打 tag 时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoSorter.exe
          generate_release_notes: true